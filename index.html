<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser Games</title>
  <meta name="description" content="Free games you can play instantly in your browser. No downloads, no sign-up.">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="./">Browser<span>Games</span></a>
      <p class="tagline">Free games. No downloads, no sign-up. Just play.</p>
    </div>
  </header>

  <main class="wrap">
    <h2 class="section-title">Games</h2>
    <div class="grid">
      <a class="card" href="games/racing/">
        <div class="thumb thumb-racing">
          <svg viewBox="0 0 200 120" aria-hidden="true">
            <path d="M30 40 C30 18 70 16 100 18 S170 20 172 44 S150 70 120 66 S80 60 70 80 S40 104 30 88 Z"
                  fill="none" stroke="#3b3e44" stroke-width="16" stroke-linejoin="round"/>
            <path d="M30 40 C30 18 70 16 100 18 S170 20 172 44 S150 70 120 66 S80 60 70 80 S40 104 30 88 Z"
                  fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="6 6" opacity=".5"/>
            <g transform="translate(96 13)"><rect width="18" height="9" rx="2" fill="#e10600"/><rect x="15" y="-1" width="3" height="11" fill="#222"/></g>
          </svg>
        </div>
        <div class="card-body">
          <h3>Grand Prix Racer</h3>
          <p>Top-down racing on circuits inspired by Monza, Monaco, Silverstone and Spa. Beat the AI field.</p>
          <span class="tags"><span>Racing</span><span>Keyboard</span></span>
        </div>
      </a>

      <div class="card soon">
        <div class="thumb"><span>?</span></div>
        <div class="card-body">
          <h3>More coming soon</h3>
          <p>New games are on the way.</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="wrap site-footer">
    <p>All games are free to play.</p>
  </footer>
</body>
</html>
